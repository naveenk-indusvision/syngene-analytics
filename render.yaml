services:
  - type: web
    name: syngene-analytics-backend
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: CHAT_API_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: syngene-analytics-chatbot
    runtime: python
    region: oregon
    rootDir: chatbot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
